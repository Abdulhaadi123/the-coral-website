# nginx site for thecoralroom.co — copy to the nginx sites/conf.d directory used on
# this server, then `nginx -t && systemctl reload nginx`. Certbot adds the 443 blocks.

# apex -> www (matches the current Vercel behaviour)
server {
    listen 80;
    server_name thecoralroom.co;
    return 301 https://www.thecoralroom.co$request_uri;
}

server {
    listen 80;
    server_name www.thecoralroom.co;

    # Admin image uploads. Keep in sync with NEXT_PUBLIC_MAX_UPLOAD_MB (default nginx limit is 1 MB).
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
