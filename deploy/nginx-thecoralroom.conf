# nginx site for thecoralroom.co — copy to the nginx sites/conf.d directory used on
# this server, then `nginx -t && systemctl reload nginx`. Certbot adds the 443 blocks.

# apex -> www (matches the current Vercel behaviour)
server {
    listen 80;
    server_name thecoralroom.co;
    return 301 https://www.thecoralroom.co$request_uri;
}

server {
    listen 80;
    server_name www.thecoralroom.co;

    # Admin image uploads. Keep in sync with NEXT_PUBLIC_MAX_UPLOAD_MB (default nginx limit is 1 MB).
    client_max_body_size 12m;

    # Portfolio images only load inside our own pages (hotlink protection): a
    # copied link opened in another browser, or another site embedding it, gets
    # 403. The CDN has the same rule (cloudfront-portfolio-image-guard.js).
    #   /_next/image         Next's image resizer. Only our pages use it, so every
    #                        request needs our Referer. Next.js can't check this
    #                        itself: it answers /_next/image before middleware runs.
    #   /images/portfolio/,  sample copies of portfolio images in /public.
    #   /images/featured/
    # nginx matches the decoded path, so encoded spellings can't slip past. This
    # stops casual copying only; a Referer header can be faked.
    # Add this block to every server block that proxies to the app (including
    # the 443 ones Certbot manages), then `nginx -t && systemctl reload nginx`.
    location ~ ^/(_next/image|images/portfolio/|images/featured/) {
        valid_referers server_names thecoralroom.co *.thecoralroom.co;
        if ($invalid_referer) {
            return 403;
        }

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
